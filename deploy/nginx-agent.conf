server {
    listen 80 default_server;
    server_name _;

    # 前端：打包出来的静态文件目录
    root /opt/agent/frontend/dist;
    index index.html;

    # 单页应用（SPA）回退规则：
    # 用户直接访问 /chat 这种前端路由时，磁盘上并没有 /chat 这个文件，
    # 就把 index.html 兜底返回，交给 vue-router 在浏览器里渲染对应页面
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端：所有 /api/ 开头的请求转发给本机 8010 端口的 FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
