# 容器版 nginx 配置（区别于宿主机版 deploy/nginx-agent.conf）
# 关键差异：proxy_pass 的目标不是 127.0.0.1:8010，
# 而是 "api" —— docker compose 网络里的服务名，容器之间用服务名互相访问
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 回退：前端路由直接访问 /chat 时兜底返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API：转发给 compose 网络中的 api 服务
    # proxy_buffering off + 后端的 X-Accel-Buffering 共同保证 SSE 流式不缓冲
    location /api/ {
        proxy_pass http://api:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
